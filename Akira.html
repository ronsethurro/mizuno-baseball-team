<script>
    // 1. 全域變數定義
    let player;
    const videoId = 'fLexgOxsZu0'; // 如果這首不行，建議換一個測試看看

    // 2. YouTube API 非同步載入 (這比直接在 HTML 寫 script 更穩定)
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 3. API 準備好後自動執行
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
            height: '0',
            width: '0',
            videoId: videoId,
            playerVars: {
                'autoplay': 0,
                'controls': 0,
                'loop': 1,
                'playlist': videoId,
                'origin': window.location.origin // 增加安全性來源標記
            },
            events: {
                'onReady': onPlayerReady,
                'onError': onPlayerError // 增加錯誤抓取
            }
        });
    }

    function onPlayerReady(event) {
        const playBtn = document.getElementById('main-play-btn');
        
        playBtn.addEventListener('click', function() {
            // 確保 player 物件存在且有 getPlayerState 方法
            if (player && player.getPlayerState) {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            } else {
                console.error("播放器尚未準備就緒");
            }
        });
    }

    function onPlayerError(e) {
        console.error("YouTube 播放發生錯誤，可能是影片禁止嵌入或 ID 錯誤。錯誤代碼：" + e.data);
    }
</script>
