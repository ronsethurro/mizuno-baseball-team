        .container {
            position: relative;

            aspect-ratio: 1/1.4;

            background-size: cover;
            background-position: top center;
        }
		
		.player-card {
			position: absolute;
			display: flex;
			flex-direction: column;
			align-items: center;
			width: 145px;
		}
		
		.name-tag {
			margin-top: 135px;
			background-color: white;
			color: #333;
			padding: 4px 12px;
			border-radius: 20px;
			font-size: 14px;
			font-weight: bold;
			white-space: nowrap;
			box-shadow: 0 2px 5px rgba(0,0,0,0.2);
			text-align: center;
			min-width: 60px;
		}
		
		.place {
			margin-top: -30px;
			background-color: white;
			color: #333;
			padding: 4px 12px;
			border-radius: 20px;
			font-size: 14px;

			white-space: nowrap;
			box-shadow: 0 2px 5px rgba(0,0,0,0.2);
			text-align: center;
			min-width: 60px;
		}

        .avatar {
            position: absolute;
            width: 125px;
            height: 125px;
            border-radius: 50%;
            border: 3px solid white;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
			transition: 0.5s all ease-in-out;
        }
		
		.avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
		
		.avatar:hover {
			transform: scale(1.1);
		}
		
		.avatar-1 {
            top: 50%;
            left: 40%;
        }
		
		.avatar-2 {

        }

		.avatar-5 {

		.avatar-6 {

            right: 3%;
        }
    </style>
